spring.application.name=finance-manager
server.port=${PORT:8080}

# H2 in-memory database (demo only — data resets on restart).
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Demo JWT settings. The secret can be overridden with the JWT_SECRET
# environment variable when the app runs hosted. This default is for the
# demo only — never use it in production.
app.jwt.secret=${JWT_SECRET:personal-finance-manager-demo-secret-change-me-in-production-0123456789abcdef}
app.jwt.expiration-ms=86400000
app.demo.email=${DEMO_EMAIL:demo@finance.local}
app.demo.password=${DEMO_PASSWORD:demo1234}
