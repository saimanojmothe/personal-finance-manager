spring.application.name=finance-manager
server.port=8080

# H2 in-memory database (demo only — data resets on restart).
spring.datasource.url=jdbc:h2:mem:financedb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Demo JWT settings. This secret is for the demo only — never use it in production.
app.jwt.secret=personal-finance-manager-demo-secret-change-me-in-production-0123456789abcdef
app.jwt.expiration-ms=86400000
app.demo.email=demo@finance.local
app.demo.password=demo1234
